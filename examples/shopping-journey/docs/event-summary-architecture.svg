<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1720" viewBox="0 0 1600 1720">
  <defs>
    <style>
      .title { font: 700 34px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #172033; }
      .section { font: 700 20px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #41506b; }
      .name { font: 700 18px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #172033; }
      .engine { font: 700 13px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .field { font: 14px 'SFMono-Regular', Menlo, monospace; fill: #27324a; }
      .small { font: 13px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #546079; }
      .label { font: 14px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #39445d; }
      .note { font: 15px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #39445d; }
      .line { fill: none; stroke: #66728a; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #8b96aa; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#arrowSoft); }
      .count-line { fill: none; stroke: #c58a31; stroke-width: 2.4; stroke-dasharray: 10 6; marker-end: url(#arrowCount); }
      .bus { fill: none; stroke: #4c5d79; stroke-width: 3; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#66728a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b96aa"/>
    </marker>
    <marker id="arrowCount" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c58a31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#182238" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1600" height="1720" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">쇼핑몰 구매 여정 집계 아키텍처</text>
  <text x="70" y="94" class="note">여정별 최초 이벤트와 발송 집계를 ClickHouse에서 누적·시간 지표로 제공한다.</text>

  <!-- Layer backgrounds -->
  <rect x="50" y="125" width="1500" height="160" rx="18" fill="#eef3fb" stroke="#d4dcea"/>
  <text x="76" y="158" class="section">1. 원천</text>
  <rect x="50" y="305" width="1500" height="250" rx="18" fill="#f6f3fb" stroke="#ded6ec"/>
  <text x="76" y="338" class="section">2. 파싱 · 판정 · ID 정규화</text>
  <rect x="50" y="575" width="1500" height="320" rx="18" fill="#fff6f5" stroke="#ecd7d3"/>
  <text x="76" y="608" class="section">3. 이벤트별 최초 데이터</text>
  <rect x="50" y="915" width="1500" height="620" rx="18" fill="#f2f8f5" stroke="#d1e4d9"/>
  <text x="76" y="948" class="section">4. 집계</text>
  <rect x="500" y="1560" width="600" height="105" rx="18" fill="#edf3ff" stroke="#c9d8f1"/>

  <!-- Edges: sources to normalization -->
  <path class="line" d="M300 245 L300 350"/>
  <path class="line" d="M800 245 L800 390"/>
  <path class="line" d="M1300 245 L1300 350"/>
  <path class="line" d="M300 410 L300 465"/>
  <path class="line" d="M1300 410 L1300 465"/>

  <!-- Reference edges -->
  <path class="line-soft" d="M120 515 L120 440 L220 440 L220 495"/>
  <path class="line-soft" d="M510 515 L510 440 L380 440 L380 495"/>
  <path class="line-soft" d="M1480 515 L1480 440 L1380 440 L1380 495"/>

  <!-- Normalization to event cards -->
  <path class="bus" d="M300 525 L300 630 L180 630 L1080 630"/>
  <path class="line" d="M180 630 L180 660"/>
  <path class="line" d="M480 630 L480 660"/>
  <path class="line" d="M780 630 L780 660"/>
  <path class="line" d="M1080 630 L1080 660"/>
  <path class="line" d="M800 450 L800 660"/>
  <path class="line" d="M1300 525 L1300 660"/>

  <!-- Event cards to aggregation bus -->
  <path class="bus" d="M180 840 L180 870 L1380 870 L1380 840"/>
  <path class="bus" d="M480 840 L480 870"/>
  <path class="bus" d="M780 840 L780 870"/>
  <path class="bus" d="M1080 840 L1080 870"/>
  <path class="bus" d="M740 870 L740 930"/>
  <path class="line" d="M740 930 L390 930 L390 995"/>
  <path class="line" d="M740 930 L1120 930 L1120 995"/>

  <!-- Aggregation edges -->
  <path class="line" d="M390 1065 L390 1110"/>
  <path class="line" d="M1120 1065 L1120 1110"/>
  <path class="count-line" d="M1440 210 L1520 210 L1520 970 L750 970 L750 995"/>
  <path class="count-line" d="M750 1065 L750 1085 L650 1085 L650 1160"/>
  <path class="line" d="M390 1420 L390 1470 L650 1470 L650 1560"/>
  <path class="line" d="M1120 1420 L1120 1470 L950 1470 L950 1560"/>

  <!-- Source nodes -->
  <g filter="url(#shadow)">
    <rect x="160" y="175" width="280" height="70" rx="12" fill="#ffffff" stroke="#9eb2d1" stroke-width="2"/>
    <rect x="660" y="175" width="280" height="70" rx="12" fill="#ffffff" stroke="#9eb2d1" stroke-width="2"/>
    <rect x="1160" y="175" width="280" height="70" rx="12" fill="#ffffff" stroke="#9eb2d1" stroke-width="2"/>
  </g>
  <text x="300" y="204" text-anchor="middle" class="name">Kafka · 쇼핑 행동 로그</text>
  <text x="300" y="228" text-anchor="middle" class="small">JSON message</text>
  <text x="800" y="204" text-anchor="middle" class="name">Kafka · 상품 링크 로그</text>
  <text x="800" y="228" text-anchor="middle" class="small">journey_id</text>
  <text x="1300" y="204" text-anchor="middle" class="name">S3 · 알림 발송</text>
  <text x="1300" y="228" text-anchor="middle" class="small">notification_count · notification_raw</text>

  <!-- Normalization nodes -->
  <g filter="url(#shadow)">
    <rect x="195" y="350" width="210" height="60" rx="30" fill="#f1e9fa" stroke="#a887c4" stroke-width="2"/>
    <rect x="195" y="465" width="210" height="60" rx="30" fill="#f1e9fa" stroke="#a887c4" stroke-width="2"/>
    <rect x="695" y="390" width="210" height="60" rx="30" fill="#f1e9fa" stroke="#a887c4" stroke-width="2"/>
    <rect x="1195" y="350" width="210" height="60" rx="12" fill="#ffffff" stroke="#68a27b" stroke-width="2"/>
    <rect x="1195" y="465" width="210" height="60" rx="30" fill="#f1e9fa" stroke="#a887c4" stroke-width="2"/>
  </g>
  <text x="300" y="386" text-anchor="middle" class="name">JSON 파싱 MV</text>
  <text x="300" y="501" text-anchor="middle" class="name">행동 판정 MV</text>
  <text x="800" y="426" text-anchor="middle" class="name">CLICK 정규화 MV</text>
  <rect x="1195" y="350" width="210" height="24" rx="10" fill="#4c9365"/>
  <text x="1300" y="368" text-anchor="middle" class="engine">MergeTree</text>
  <text x="1300" y="397" text-anchor="middle" class="name">notification_raw</text>
  <text x="1300" y="501" text-anchor="middle" class="name">NOTIFY 정규화 MV</text>

  <!-- Reference nodes -->
  <rect x="65" y="470" width="110" height="45" rx="8" fill="#fff8df" stroke="#c8ad50"/>
  <rect x="445" y="470" width="130" height="45" rx="8" fill="#fff8df" stroke="#c8ad50"/>
  <rect x="1430" y="470" width="105" height="45" rx="8" fill="#fff8df" stroke="#c8ad50"/>
  <text x="120" y="491" text-anchor="middle" class="small">shop_action</text>
  <text x="120" y="507" text-anchor="middle" class="small">_rules</text>
  <text x="510" y="498" text-anchor="middle" class="small">journey_map</text>
  <text x="1482" y="491" text-anchor="middle" class="small">journey</text>
  <text x="1482" y="507" text-anchor="middle" class="small">_map</text>

