  <g filter="url(#shadow)">
    <g>
      <rect x="70" y="660" width="220" height="180" rx="10" fill="#fffefe" stroke="#c47772" stroke-width="2"/>
      <rect x="70" y="660" width="220" height="28" rx="10" fill="#b45f5a"/>
      <text x="180" y="680" text-anchor="middle" class="engine">ReplacingMergeTree</text>
      <text x="180" y="718" text-anchor="middle" class="name">view_event</text>
    </g>
    <g>
      <rect x="370" y="660" width="220" height="180" rx="10" fill="#fffefe" stroke="#c47772" stroke-width="2"/>
      <rect x="370" y="660" width="220" height="28" rx="10" fill="#b45f5a"/>
      <text x="480" y="680" text-anchor="middle" class="engine">ReplacingMergeTree</text>
      <text x="480" y="718" text-anchor="middle" class="name">cart_event</text>
    </g>
    <g>
      <rect x="670" y="660" width="220" height="180" rx="10" fill="#fffefe" stroke="#c47772" stroke-width="2"/>
      <rect x="670" y="660" width="220" height="28" rx="10" fill="#b45f5a"/>
      <text x="780" y="680" text-anchor="middle" class="engine">ReplacingMergeTree</text>
      <text x="780" y="718" text-anchor="middle" class="name">click_event</text>
    </g>
    <g>
      <rect x="970" y="660" width="220" height="180" rx="10" fill="#fffefe" stroke="#c47772" stroke-width="2"/>
      <rect x="970" y="660" width="220" height="28" rx="10" fill="#b45f5a"/>
      <text x="1080" y="680" text-anchor="middle" class="engine">ReplacingMergeTree</text>
      <text x="1080" y="718" text-anchor="middle" class="name">purchase_event</text>
    </g>
    <g>
      <rect x="1270" y="660" width="220" height="180" rx="10" fill="#fffefe" stroke="#c47772" stroke-width="2"/>
      <rect x="1270" y="660" width="220" height="28" rx="10" fill="#b45f5a"/>
      <text x="1380" y="680" text-anchor="middle" class="engine">ReplacingMergeTree</text>
      <text x="1380" y="718" text-anchor="middle" class="name">notification_event</text>
    </g>
  </g>

  <!-- Shared event fields -->
  <g class="field">
    <text x="90" y="748">product_id</text><text x="90" y="772">journey_id</text><text x="90" y="796">occurred_at</text><text x="90" y="820">first_version · count_delta</text>
    <text x="390" y="748">product_id</text><text x="390" y="772">journey_id</text><text x="390" y="796">occurred_at</text><text x="390" y="820">first_version · count_delta</text>
    <text x="690" y="748">product_id</text><text x="690" y="772">journey_id</text><text x="690" y="796">occurred_at</text><text x="690" y="820">first_version · count_delta</text>
    <text x="990" y="748">product_id</text><text x="990" y="772">journey_id</text><text x="990" y="796">occurred_at</text><text x="990" y="820">first_version · count_delta</text>
    <text x="1290" y="748">product_id</text><text x="1290" y="772">journey_id</text><text x="1290" y="796">occurred_at</text><text x="1290" y="820">first_version · count_delta</text>
  </g>

  <!-- Aggregation process nodes -->
  <g filter="url(#shadow)">
    <rect x="240" y="995" width="300" height="70" rx="35" fill="#e8f3ed" stroke="#5e9b75" stroke-width="2"/>
    <rect x="950" y="995" width="340" height="70" rx="35" fill="#fff0e6" stroke="#c9824f" stroke-width="2"/>
  </g>
  <text x="390" y="1026" text-anchor="middle" class="name">행동 누적 Summary MV</text>
  <text x="390" y="1048" text-anchor="middle" class="small">count_delta &gt; 0 · sum(count_delta)</text>
  <text x="1120" y="1026" text-anchor="middle" class="name">최초 상태 비교 · 시간 delta</text>
  <text x="1120" y="1048" text-anchor="middle" class="small">신규 +1 · 시간 이동 -1/+1 · 상품별 보정</text>

  <g filter="url(#shadow)">
    <rect x="650" y="995" width="200" height="70" rx="35" fill="#fff8df" stroke="#c58a31" stroke-width="2"/>
  </g>
  <text x="750" y="1026" text-anchor="middle" class="name">발송 Count 반영</text>
  <text x="750" y="1048" text-anchor="middle" class="small">notification_count delta</text>

  <!-- Summary cards -->
  <g filter="url(#shadow)">
    <rect x="130" y="1110" width="520" height="310" rx="12" fill="#ffffff" stroke="#4d9271" stroke-width="2"/>
    <rect x="130" y="1110" width="520" height="32" rx="12" fill="#3f8766"/>
    <rect x="850" y="1110" width="540" height="310" rx="12" fill="#ffffff" stroke="#bd7250" stroke-width="2"/>
    <rect x="850" y="1110" width="540" height="32" rx="12" fill="#ad6546"/>
  </g>
  <text x="390" y="1132" text-anchor="middle" class="engine">SummingMergeTree</text>
  <text x="1120" y="1132" text-anchor="middle" class="engine">SummingMergeTree</text>
  <text x="390" y="1174" text-anchor="middle" class="name">cumulative_summary</text>
  <text x="1120" y="1174" text-anchor="middle" class="name">hourly_summary</text>

  <g class="field">
    <text x="170" y="1210">mall_id</text>
    <text x="170" y="1238">store_id</text>
    <text x="170" y="1266">product_id</text>
    <text x="170" y="1294">notify_count · view_count</text>
    <text x="170" y="1322">cart_count · click_count</text>
    <text x="170" y="1350">purchase_count</text>
    <text x="170" y="1378">숫자 delta 합산값</text>

    <text x="890" y="1210">mall_id · store_id · product_id</text>
    <text x="890" y="1238">event_hour</text>
    <text x="890" y="1266">first_event_state 기준 시간 귀속</text>
    <text x="890" y="1294">notify_count · click_count</text>
    <text x="890" y="1322">view_count · cart_count</text>
    <text x="890" y="1350">purchase_count</text>
    <text x="890" y="1378">signed count delta</text>
  </g>

  <text x="390" y="1402" text-anchor="middle" class="small">최초 이벤트의 숫자 delta와 발송 Count를 상품별로 합산</text>
  <text x="1120" y="1402" text-anchor="middle" class="small">실시간 delta 반영 후 이벤트 FINAL 정답과 상품별 보정</text>

  <!-- Metric box -->
  <text x="800" y="1595" text-anchor="middle" class="name">쇼핑몰 지표 조회 API</text>
  <text x="800" y="1622" text-anchor="middle" class="small">상품 누적 · 고객 그룹 · 시간별 구매 여정 지표</text>
  <text x="800" y="1646" text-anchor="middle" class="small">Summary만 조회하고 원본 이벤트는 조회하지 않음</text>

  <!-- Footer legend -->
  <rect x="70" y="1685" width="16" height="16" rx="3" fill="#b45f5a"/>
  <text x="96" y="1698" class="small">최초 이벤트</text>
  <rect x="220" y="1685" width="16" height="16" rx="3" fill="#3f8766"/>
  <text x="246" y="1698" class="small">누적 집계</text>
  <rect x="360" y="1685" width="16" height="16" rx="3" fill="#ad6546"/>
  <text x="386" y="1698" class="small">시간 집계</text>
  <path d="M520 1693 L565 1693" class="line-soft"/>
  <text x="580" y="1698" class="small">참조 관계</text>
</svg>
