      .engine { font: 700 12px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .body { font: 14px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #3f4c63; }
      .small { font: 12px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #687389; }
      .code { font: 13px 'SFMono-Regular', Menlo, monospace; fill: #2e3950; }
      .line { fill: none; stroke: #68758c; stroke-width: 2.2; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #68758c; stroke-width: 2.4; }
      .cumulative { fill: none; stroke: #438965; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .hourly { fill: none; stroke: #bd7048; stroke-width: 2.5; marker-end: url(#arrowOrange); }
      .repair { fill: none; stroke: #875ab0; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758c"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#438965"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bd7048"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#875ab0"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#182238" flood-opacity="0.12"/></filter>
