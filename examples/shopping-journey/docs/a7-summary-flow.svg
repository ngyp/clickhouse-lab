<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360">
  <defs>
    <style>
      .title { font: 700 34px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #172033; }
      .subtitle { font: 15px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #59657a; }
      .section { font: 700 21px 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #26334a; }
