apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=900M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.clickhouse.svc.cluster.local:9092
          ports:
            - containerPort: 9092
              name: kafka
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "1300Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: clickhouse
spec:
  selector:
    app: redpanda
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
