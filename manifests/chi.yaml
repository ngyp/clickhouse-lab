apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: chi
  namespace: clickhouse
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: default-volume-claim
  configuration:
    zookeeper:
      nodes:
        - host: keeper-chk
          port: 2181
    clusters:
      - name: "cluster1"
        layout:
          shardsCount: 3
          replicasCount: 3
  templates:
    volumeClaimTemplates:
      - name: default-volume-claim
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
